name: Publish

# The RELEASE path — publishes @charlesgreen/llm-gateway to GitHub Packages on a
# `v*` tag, never on a merge to main.
#
# Why tag-triggered: a published version is IMMUTABLE. Unpublishing is disruptive at
# best and blocked at worst, which puts a publish in the same irreversible class as a
# prod deploy — and the house rule for that class is a deliberate, human-gated
# trigger. Publishing on merge would make every merged PR an irreversible external
# side effect, and would force a version decision into every PR.
#
# ── Why two jobs instead of one ───────────────────────────────────────────────────
# This splits the release flow across two jobs — `verify` (ungated) and `publish`
# (Environment-gated) — for one reason: GitHub pauses an environment-bound job at
# its START, before any of its steps run. A single gated job would therefore ask the
# required reviewer to approve BEFORE the tag assertion and `pnpm check` had
# produced any evidence — the human would be gating the gate, and a tag that fails
# the version assertion would still page them. The split puts the human last, on the
# irreversible step only.
# ─────────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  # Never two publishes of the same tag in flight. NOT cancel-in-progress: a publish
  # is irreversible, so a half-run must be allowed to finish or fail on its own terms
  # rather than be killed mid-write.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Prove the tag tells the truth, and that the artifact passes its own gate ──
  # Ungated on purpose: this is the evidence the reviewer in job 2 approves against.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      # Deliberately EMPTY — see ci.yml for the full reasoning. This job installs
      # and builds; it never publishes, so it is handed no credential at all.
      NODE_AUTH_TOKEN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # FIRST, before install or build. A tag that disagrees with package.json can
      # never publish correctly, so it should cost seconds rather than a full gate
      # run — and it must fail before anything is uploaded for the publish job.
      # `github.ref` (refs/tags/vX.Y.Z), NOT `github.ref_name`: the script requires
      # the refs/tags/ prefix precisely so a mis-wired trigger fails loudly here.
      # Verified by test/assert-tag-version.test.ts, which watches every failure
      # mode fire — the only way to exercise this check without publishing for real.
      - name: Assert the tag matches package.json version
        run: node scripts/assert-tag-version.mjs "${{ github.ref }}"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile

      # The same single gate CI runs on every PR. A tag does not earn an exemption:
      # never publish an artifact that has not passed its own check. This is also
      # what produces the dist/ handed to the publish job.
      - name: Check (lint + typecheck + test:coverage + build + no-provider-literals)
        run: pnpm check

      # Hand the EXACT bytes that passed the no-provider-literals scan over dist/ to
      # the publish job, rather than rebuilding there. Rebuilding would publish an
      # artifact one step removed from the one the gate actually cleared.
      - name: Upload the verified dist
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload test + coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publish-test-coverage-reports
          path: |
            coverage/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ── 2. The irreversible step ────────────────────────────────────────────────────
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # `environment: publish` is where release controls (required reviewers,
    # deployment branch policy, etc.) attach — an Environment with no protection
    # rule configured is a silent no-op, so `environment: publish` alone is not
    # proof this job is gated. Check the repo's Settings → Environments for the
    # controls actually in force before trusting this line; do not assume from its
    # presence here.
    environment: publish
    permissions:
      contents: read
      # The only elevated scope in this repo, granted to exactly one job.
      packages: write
      # NOTE: no `actions: read`. This block REPLACES the default token scopes, so
      # it was worth confirming rather than assuming: actions/download-artifact
      # requires an explicit token only when fetching from a DIFFERENT repository or
      # a DIFFERENT workflow run (its `repository` / `run-id` inputs). The download
      # below passes neither — it is a same-run, same-repo fetch — so it resolves
      # from the run context and needs no extra scope. Keep it that way.
    env:
      # Empty by default so the setup steps (and setup-node's internal `pnpm store
      # path`) do not warn on the .npmrc substitution. The REAL token is applied at
      # step scope on the publish step alone — the one step that needs to write.
      NODE_AUTH_TOKEN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # No build here by design — dist/ arrives as the verified artifact from job 1.
      - name: Download the verified dist
        uses: actions/download-artifact@v6
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      # The upload side guards itself with `if-no-files-found: error`; this is the
      # matching assertion on the receiving side, and it closes the ONE path where a
      # green `verify` still ships a broken package. `files` is ["dist", "src"], so a
      # dist/ that arrived empty or partial would still produce a perfectly valid
      # tarball — one whose `exports` resolve to nothing, failing in the consumer's
      # bundler rather than here. Both subpath entrypoints declared in package.json
      # are checked, types included, because those are exactly what a consumer
      # resolves through.
      - name: Assert the verified dist actually arrived
        run: |
          set -euo pipefail
          for f in dist/index.js dist/index.d.ts \
                   dist/testing/index.js dist/testing/index.d.ts; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is missing or empty — the verified dist did not"\
                   "arrive intact. Refusing to publish: package.json#exports would"\
                   "resolve to nothing and the break would surface in a consumer's"\
                   "bundler instead of here."
              exit 1
            fi
          done
          echo "verified dist intact — $(find dist -type f | wc -l) file(s)"

      # Re-asserted after checkout in this job too. Cheap, and it closes the window
      # where the two jobs could disagree about what is being shipped.
      - name: Re-assert the tag matches package.json version
        run: node scripts/assert-tag-version.mjs "${{ github.ref }}"

      # `--no-git-checks`: a tag build is a detached HEAD, which pnpm otherwise
      # refuses to publish from. Registry + restricted access come from
      # package.json#publishConfig, and the @charlesgreen scope mapping from the
      # committed .npmrc — together they make it impossible for this to reach public
      # npm even if the registry flag were dropped. GITHUB_TOKEN is sufficient: this
      # is a same-account publish, which is the case it is unambiguously good for.
      - name: Publish to GitHub Packages
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
