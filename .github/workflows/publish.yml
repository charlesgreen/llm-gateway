name: Publish

# The RELEASE path (DESIGN.md §4.2) — publishes @charlesgreen/llm-gateway to GitHub
# Packages on a `v*` tag, never on a merge to main.
#
# Why tag-triggered: a published version is IMMUTABLE. Unpublishing is disruptive at
# best and blocked at worst, which puts a publish in the same irreversible class as a
# prod deploy — and the house rule for that class is a deliberate, human-gated
# trigger. Publishing on merge would make every merged PR an irreversible external
# side effect, and would force a version decision into every PR. Each release also
# costs one package-cool-down exclude edit in EVERY consumer (DESIGN.md §5.3), so the
# trigger should make "few and deliberate" the path of least resistance.
#
# ── DEVIATION FROM DESIGN.md §4.2, recorded deliberately ─────────────────────────
# §4.2 lists the flow as five numbered steps in one job. This splits them across two
# jobs — `verify` (ungated) and `publish` (Environment-gated) — for one reason:
# GitHub pauses an environment-bound job at its START, before any of its steps run.
# A single gated job would therefore ask the required reviewer to approve BEFORE the
# tag assertion and `pnpm check` had produced any evidence — the human would be
# gating the gate, and a tag that fails the version assertion would still page them.
# The split puts the human last, on the irreversible step only, which is what §4.2's
# "the irreversible step gets a human" actually asks for. Same shape as the
# gate-job → environment-bound-deploy-job pattern used for prod deploys elsewhere in
# the portfolio. No decision in §4.2 is changed; only the step layout.
# ─────────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  # Never two publishes of the same tag in flight. NOT cancel-in-progress: a publish
  # is irreversible, so a half-run must be allowed to finish or fail on its own terms
  # rather than be killed mid-write.
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── 1. Prove the tag tells the truth, and that the artifact passes its own gate ──
  # Ungated on purpose: this is the evidence the reviewer in job 2 approves against.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      # Deliberately EMPTY — see ci.yml for the full reasoning. This job installs
      # and builds; it never publishes, so it is handed no credential at all.
      NODE_AUTH_TOKEN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # FIRST, before install or build. A tag that disagrees with package.json can
      # never publish correctly, so it should cost seconds rather than a full gate
      # run — and it must fail before anything is uploaded for the publish job.
      # `github.ref` (refs/tags/vX.Y.Z), NOT `github.ref_name`: the script requires
      # the refs/tags/ prefix precisely so a mis-wired trigger fails loudly here.
      # Verified by test/assert-tag-version.test.ts, which watches every failure
      # mode fire — the only way to exercise this check without publishing for real.
      - name: Assert the tag matches package.json version
        run: node scripts/assert-tag-version.mjs "${{ github.ref }}"

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --trust-lockfile

      # The same single gate CI runs on every PR. A tag does not earn an exemption:
      # never publish an artifact that has not passed its own check (DESIGN.md §4.2
      # step 3). This is also what produces the dist/ handed to the publish job.
      - name: Check (lint + typecheck + test:coverage + build + no-provider-literals)
        run: pnpm check

      # Hand the EXACT bytes that passed the no-provider-literals scan over dist/ to
      # the publish job, rather than rebuilding there. Rebuilding would publish an
      # artifact one step removed from the one the gate actually cleared.
      - name: Upload the verified dist
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload test + coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: publish-test-coverage-reports
          path: |
            coverage/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ── 2. The irreversible step ────────────────────────────────────────────────────
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ⚠️ NOT CURRENTLY HUMAN-GATED. Read this before trusting the line below.
    #
    # The `publish` Environment EXISTS but carries `protection_rules: []`. Attaching
    # a required reviewer was attempted and REFUSED by the API, 2026-08-29:
    #
    #   422 — "Failed to create the environment protection rule. Please ensure the
    #          billing plan supports the required reviewers protection rule."
    #
    # Required reviewers on a PRIVATE repo need a paid plan (GitHub Pro on a user
    # account); this account is on the free tier, so the environment was created
    # bare. Branch protection on main is unaffected and IS active — the two controls
    # have different plan requirements, which is why one worked and this did not.
    #
    # An Environment with no protection rule is a SILENT NO-OP: this job runs
    # unattended and merely LOOKS gated, which is the failure mode worth naming out
    # loud rather than discovering after a bad tag ships. Right now the only control
    # on a publish is who can cut a `v*` tag — i.e. tagging IS shipping, in one
    # motion, not two (DESIGN.md §8, open question 3, now answered empirically).
    #
    # To close it, either:
    #   a) upgrade to GitHub Pro, then re-run the PUT that failed:
    #        gh api -X PUT repos/charlesgreen/llm-gateway/environments/publish \
    #          -F wait_timer=0 -F prevent_self_review=false \
    #          -f 'reviewers[][type]=User' -F 'reviewers[][id]=1191302'
    #      then VERIFY the rule actually attached — a 2xx is not proof:
    #        gh api repos/charlesgreen/llm-gateway/environments/publish \
    #          --jq '.protection_rules'
    #   b) or add the interim control: a `v*` tag-protection ruleset with an empty
    #      bypass list, mirroring vendorwatch's "protect prod release tags". That
    #      restricts WHO may trigger a publish rather than adding a second pair of
    #      eyes — weaker, but real, and it keeps an agent from cutting a release tag.
    #
    # This line stays as-is either way: the moment a reviewer is attached, the gate
    # engages with no change to this file.
    environment: publish
    permissions:
      contents: read
      # The only elevated scope in this repo, granted to exactly one job.
      packages: write
    env:
      # Empty by default so the setup steps (and setup-node's internal `pnpm store
      # path`) do not warn on the .npmrc substitution. The REAL token is applied at
      # step scope on the publish step alone — the one step that needs to write.
      NODE_AUTH_TOKEN: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # No build here by design — dist/ arrives as the verified artifact from job 1.
      - name: Download the verified dist
        uses: actions/download-artifact@v6
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      # Re-asserted after checkout in this job too. Cheap, and it closes the window
      # where the two jobs could disagree about what is being shipped.
      - name: Re-assert the tag matches package.json version
        run: node scripts/assert-tag-version.mjs "${{ github.ref }}"

      # `--no-git-checks`: a tag build is a detached HEAD, which pnpm otherwise
      # refuses to publish from. Registry + restricted access come from
      # package.json#publishConfig, and the @charlesgreen scope mapping from the
      # committed .npmrc — together they make it impossible for this to reach public
      # npm even if the registry flag were dropped. GITHUB_TOKEN is sufficient: this
      # is a same-account publish, which is the case it is unambiguously good for.
      - name: Publish to GitHub Packages
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
